name: Build Android 1.12.2 Renderer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"
        shell: bash

      - name: Verify Android toolchain
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          sdkmanager --version
          test -d "$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          "$ANDROID_SDK_ROOT/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
        shell: bash

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build renderer
        run: gradle assembleRelease -PMG_LEGACY_1122=true --no-daemon

      - name: Upload Android native libraries
        uses: actions/upload-artifact@v4
        with:
          name: KrispyGL40-1.12.2
          path: |
            **/build/intermediates/merged_native_libs/release/out/lib/**/*.so
            **/build/outputs/aar/*.aar
          if-no-files-found: error
