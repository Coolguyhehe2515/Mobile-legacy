name: Build Android 1.12.2 Renderer

on:
  workflow_dispatch:
  push:
    paths:
      - toggles.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check Actions toggle
        id: toggle
        run: |
          status=$(jq -r '.status // "off"' toggles.json)
          if [ "$status" = "on" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Actions toggle is on. Building renderer."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Actions toggle is off. Skipping build."
          fi

      - name: Set up JDK
        if: steps.toggle.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        if: steps.toggle.outputs.enabled == 'true'
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.3.13750724"
        shell: bash

      - name: Verify Android toolchain
        if: steps.toggle.outputs.enabled == 'true'
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          sdkmanager --version
          test -d "$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          test -d "$ANDROID_SDK_ROOT/cmake/3.22.1"
          "$ANDROID_SDK_ROOT/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
          "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" --version
        shell: bash

      - name: Set up Gradle
        if: steps.toggle.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build renderer
        if: steps.toggle.outputs.enabled == 'true'
        run: gradle assembleRelease -PMG_LEGACY_1122=true --no-daemon

      - name: Upload Android native libraries
        if: steps.toggle.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-legacy-1.12.2
          path: |
            **/build/intermediates/merged_native_libs/release/out/lib/**/*.so
            **/build/outputs/aar/*.aar
          if-no-files-found: error

      - name: Reset Actions toggle to off
        if: always() && steps.toggle.outputs.enabled == 'true'
        run: |
          jq '.status = "off"' toggles.json > toggles.json.tmp
          mv toggles.json.tmp toggles.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toggles.json
          git commit -m "Reset Actions toggle to off"
          git push
