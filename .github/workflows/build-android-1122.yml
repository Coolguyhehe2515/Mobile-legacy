name: Build Android 1.12.2 Renderer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.3.13750724

      - name: Verify Android toolchain
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          ls -la "$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          "$ANDROID_SDK_ROOT/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build renderer
        run: gradle assembleRelease -PMG_LEGACY_1122=true --no-daemon

      - name: Upload Android native libraries
        uses: actions/upload-artifact@v4
        with:
          name: KrispyGL40-1.12.2
          path: |
            **/build/intermediates/merged_native_libs/release/out/lib/**/*.so
            **/build/outputs/aar/*.aar
          if-no-files-found: error
